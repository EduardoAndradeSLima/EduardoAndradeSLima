<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Eduardo Andrade - Student, Developer, Builder">
  <title>Eduardo Andrade — Student · Developer · Builder</title>
  <defs>
    <!-- Dark, understated base mirrors the Nickdpaes reference; violet draws from Eduardo's chosen accent. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090b11"/>
      <stop offset="51%" stop-color="#111321"/>
      <stop offset="100%" stop-color="#0d0c17"/>
    </linearGradient>
    <linearGradient id="nameGlow" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ede9fe" stop-opacity="0.98"/>
      <stop offset="52%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
      <animate attributeName="x1" values="-500;1580" dur="5.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-80;2000" dur="5.7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="subGlow" x1="0" y1="0" x2="290" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="49%" stop-color="#ddd6fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
      <animate attributeName="x1" values="-400;1580" dur="5.7s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-110;1870" dur="5.7s" begin=".4s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="maskName">
      <rect width="1200" height="300" fill="black"/>
      <text x="600" y="151" text-anchor="middle" fill="white"
            font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
            font-size="68" font-weight="700" letter-spacing="-.5">Eduardo Andrade</text>
    </mask>
    <mask id="maskRole">
      <rect width="1200" height="300" fill="black"/>
      <text x="600" y="205" text-anchor="middle" fill="white"
            font-family="Consolas,Menlo,Monaco,Courier New,monospace"
            font-size="19" letter-spacing="4">STUDENT · DEVELOPER · BUILDER</text>
    </mask>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#392d55" stroke-width="1" opacity=".68">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="1080" y1="0" x2="1080" y2="300"/>
  </g>
  <g fill="#a78bfa" opacity=".65">
    <circle cx="60" cy="60" r="2"/><circle cx="1140" cy="60" r="2"/>
    <circle cx="60" cy="240" r="2"/><circle cx="1140" cy="240" r="2"/>
  </g>
  <text x="600" y="151" text-anchor="middle" fill="#e9e8f1"
        font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="68" font-weight="700" letter-spacing="-.5">Eduardo Andrade</text>
  <text x="600" y="205" text-anchor="middle" fill="#a78bfa"
        font-family="Consolas,Menlo,Monaco,Courier New,monospace"
        font-size="19" letter-spacing="4">STUDENT · DEVELOPER · BUILDER</text>
  <rect width="1200" height="300" fill="url(#nameGlow)" mask="url(#maskName)"/>
  <rect width="1200" height="300" fill="url(#subGlow)" mask="url(#maskRole)"/>
  <rect x="0" y="297" width="260" height="3" fill="#8b5cf6" opacity=".9">
    <animate attributeName="x" values="-260;1200" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <g fill="#aa90f5">
    <rect x="596" y="225" width="8" height="14" opacity=".7">
      <animate attributeName="opacity" values=".75;.75;0;0;.75" keyTimes="0;.45;.5;.95;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
